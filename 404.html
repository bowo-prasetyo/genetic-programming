<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EquVolve has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://bowo-prasetyo.github.io/equvolve/">
  <script>
    // EquVolve used to live at /genetic-programming/. Send visitors to the
    // same place at /equvolve/, keeping the rest of the address: the #/...
    // part carries share links (#/?run=...) and the About page (#/about).
    // This page is also served as 404.html, for deeper old paths.
    (function () {
      var path = location.pathname.replace(/^\/genetic-programming(\/|$)/, '/equvolve/');
      if (path.indexOf('/equvolve/') !== 0) path = '/equvolve/';
      location.replace('https://bowo-prasetyo.github.io' + path + location.search + location.hash);
    })();
  </script>
  <!-- without JavaScript: go to the start page -->
  <meta http-equiv="refresh" content="0; url=https://bowo-prasetyo.github.io/equvolve/">
  <style>
    body { font-family: system-ui, sans-serif; margin: 3em auto; max-width: 36em; padding: 0 1em; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>EquVolve has moved</h1>
  <p>
    This app, formerly <em>genetic-programming</em>, is now EquVolve:
    <a href="https://bowo-prasetyo.github.io/equvolve/">bowo-prasetyo.github.io/equvolve</a>.
  </p>
  <p>Its code is at <a href="https://github.com/bowo-prasetyo/equvolve">github.com/bowo-prasetyo/equvolve</a>.</p>
</body>
</html>
